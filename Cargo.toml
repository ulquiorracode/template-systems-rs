[package]
name = "template-systems-rs"
version = "0.1.0"
edition = "2024"
authors = ["UlquiorraCode Contributors"]
license = "MIT OR Apache-2.0"
description = "Battle-tested systems-grade template for high-performance Rust services, engines, and libraries"
readme = "README.md"
repository = "https://github.com/ulquiorracode/template-systems-rs"

[dependencies]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "baseline_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
